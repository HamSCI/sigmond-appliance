# publish-targets.conf — WHERE BUILD PRODUCTS GO.  One declaration, read by
# both halves of the ladder, so the destination never depends on who ran what.
#
#   build-usb-v3.sh   uploads every build to   <dest>/pending/
#   bless-release.sh  promotes it to           <dest>/
#
# Every target listed here gets both. A target that fails is named in the
# output and fails the step — a product that silently reached one destination
# and not another is the thing this file exists to prevent.
#
# Format:  <label>  <rclone destination>
#   A destination may be a configured remote (`gdrive:folder`) or an rclone
#   connection string (`gdrive,root_folder_id=<id>:`) to reach a folder that
#   is not the remote's root.  Blank lines and # comments are ignored.
#
# Adding a person: add a line. Do not publish by hand — a hand-copied image
# is exactly the "where did this build go?" problem.

rob   gdrive:sigmond-images
mjh   gdrive,root_folder_id=1Eym7xsP_qVvbGOVmlXER73K3jx6J7dQs:
