# publish-targets.conf — WHERE BUILD PRODUCTS GO.  One declaration, read by
# both halves of the ladder, so the destination never depends on who ran what.
#
# Format:  <label>  <destination>  [stage]
#
#   stage = pending  (default)  receives EVERY build into <dest>/pending/ the
#                               moment it exists, and the bless promotes it
#                               to <dest>/.  Lets you burn an untested build
#                               in parallel with the nested test.
#
#   stage = blessed             receives NOTHING until the bless.  A blessed
#                               image is copied straight to <dest>/, so every
#                               file in that folder is, by definition, tested
#                               and blessed — nothing to mistake for ready.
#
# A destination may be a configured remote (`gdrive:folder`), an rclone
# connection string (`gdrive,root_folder_id=<id>:`) for a folder that is not
# the remote's root, or `ssh:<host>:<dir>` for a host reached over ssh/scp
# (`ssh:wd30:` = wd30's home; builds land in ~/pending/, the bless moves them
# to ~/).  Blank lines and # comments are ignored.
#
# Adding a person: add a line. Do not publish by hand — a hand-copied image
# is exactly the "where did this build go?" problem this file exists to end.
#
# ⛔ EACH DRIVE LINE MUST NAME A REMOTE HOLDING THAT PERSON'S OWN LOGIN
# (`rclone config` on the rig).  Drive bills the UPLOADING ACCOUNT, not the
# folder's owner, so a target pointed at someone else's folder still costs the
# uploader.  Until 2026-10-24 the mjh line rode rob's `gdrive` login and every
# image in mjh's folder counted against rob's quota.  Measured on the rig that
# day: 512 MiB written into mjh's folder moved rob's quota 52.799 -> 53.299
# GiB, exactly +0.500, and deleting it landed in ROB's trash.  At that moment
# mjh's folder held 51.25 GiB in 48 files while rob's whole own Drive tree
# held 6.16 GiB in 1226 files.  mjh added the `mjhdrive` remote the same day
# (c47c5f4), which is what actually moved the cost.
#
# rob's own folder is no longer a destination (2026-10-24, his call): with the
# mjh line on mjh's login it was a pure duplicate on a nearly-full quota.
# mjh's 2026-09-30 rule was that no build may live only in one person's Drive;
# `ssh:wd30:` still holds the archive copy outside Drive entirely, so that
# rule survives.
# Adding a person: add a line. Do not publish by hand — a hand-copied image
# is exactly the "where did this build go?" problem this file exists to end.
#
# ⛔ WHOSE QUOTA PAYS IS DECIDED BY THE REMOTE, NOT BY THE FOLDER.
#
# In Google Drive the ACCOUNT THAT UPLOADS owns the file and is billed for it,
# wherever it lands.  The rig has exactly one rclone remote, `gdrive:`, holding
# rob's OAuth token — so every byte below, including the copies that sit in
# mjh's folder, is charged to rob.  Measured on the rig 2026-10-24: 512 MiB
# written into mjh's folder moved rob's quota from 52.799 to 53.299 GiB,
# exactly +0.500, and deleting it put it in ROB's trash.  At that moment mjh's
# folder held 51.25 GiB in 48 files while rob's whole own Drive tree held
# 6.16 GiB in 1226 files: nearly all of rob's 150 GiB account was these images
# under someone else's folder name.
#
# So pointing a target at another person's folder does NOT move the cost to
# them.  Moving the cost needs a SECOND REMOTE holding THAT person's token:
#
#     mjh  mjhdrive,root_folder_id=1Eym7xsP_qVvbGOVmlXER73K3jx6J7dQs:  pending
#
# `rclone authorize "drive"` in that person's browser, once, pasted into the
# rig's rclone.conf as a new remote.  Nothing else changes — publish-lib reads
# a connection string either way, and pub_fetch_url keeps emitting a
# credential-free URL per target.
#
# 2026-10-24, rob's call: his Drive is nearly full and mjh's is not, so rob's
# own folder is dropped as a destination.  That removes a genuine DUPLICATE
# (the same image was landing in two folders on the same quota), but until the
# mjh remote above exists the bytes are still rob's.  mjh's 2026-09-30 rule was
# that no build may live only in one person's Drive; `ssh:wd30:` still holds
# the archive copy outside Drive entirely, so that rule survives this.

mjh   mjhdrive,root_folder_id=1Eym7xsP_qVvbGOVmlXER73K3jx6J7dQs:  pending
wd30  ssh:wd30:                                                pending
